name: Bug
description: Something in the docs, scripts, or a future run does not work as stated.
title: "[bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security issue, use a [private advisory](https://github.com/Troy-LL/trace-anything/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, files, or a short sequence we can follow.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: verify-docs output
      description: Paste the output of `bash scripts/verify-docs.sh` if this is a docs or link problem.
      render: text
    validations:
      required: false
